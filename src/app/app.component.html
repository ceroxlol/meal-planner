<mat-toolbar color="primary">
  <img src="chef-hat.svg" width="40px"/><span>meal-planner</span>
  <span class="spacer"></span>
  <button mat-raised-button color="accent" class="add-meal-button" (click)="openMealDialog()">
    <mat-icon>add</mat-icon>
    Add Meal
  </button>
</mat-toolbar>

<div class="container">
  <!-- Centered Daily Meal Component -->
  <div class="daily-meal-container">
    <app-daily-meal
      (dailyMealSelected)="openMealDialog($event)"
    ></app-daily-meal>
  </div>

  <!-- Search Bar -->
  <div class="search-bar-container">
    <app-search-bar (search)="onSearch($event)"></app-search-bar>
  </div>

  <!-- Meal List with Padding -->
  <div class="meal-list-container">
    <app-meal-list
      (mealSelected)="openMealDialog($event)"
      [refreshTrigger]="refreshMealList"
      [searchTerm]="searchTerm"
    ></app-meal-list>
  </div>
</div>
