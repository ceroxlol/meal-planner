<h2 mat-dialog-title class="dialog-header">
  {{ componentTitle }}
  <button
    mat-icon-button
    class="close-button"
    (click)="onCancel()"
    style="float: right"
  >
    <mat-icon>close</mat-icon>
  </button>
</h2>
<div mat-dialog-content class="dialog-content">
  <form>
    <!-- Meal Title -->
    <mat-form-field appearance="fill">
      <mat-label>Meal Title</mat-label>
      <input matInput [(ngModel)]="data.meal.title" name="title" />
    </mat-form-field>

    <!-- Cooking Time -->
    <mat-form-field appearance="fill">
      <mat-label>Cooking Time (minutes)</mat-label>
      <input
        matInput
        type="number"
        [(ngModel)]="data.meal.cookingTime"
        name="timeToCook"
      />
    </mat-form-field>

    <!-- Effort Level (mat-slider placed outside of mat-form-field) -->
    <mat-label>Effort Level</mat-label>
    <!--    <mat-slider
      [(ngModel)]="data.meal.effortLevel"
      name="effortLevel"
      min="1"
      max="5"
      step="1"
    ></mat-slider>-->

    <mat-form-field appearance="fill">
      <mat-label>Image URL</mat-label>
      <input
        matInput
        [(ngModel)]="imageUrl"
        (change)="onImageUrlChange($event)"
        placeholder="Enter image URL"
        name="imageUrl"
      />
    </mat-form-field>

    <div *ngIf="data.meal.imageUrl">
      <img
        [src]="data.meal.imageUrl"
        alt="Meal Image"
        style="max-width: 100%; margin-top: 10px"
      />
    </div>

    <!-- Ingredients Input Field -->
    <mat-form-field appearance="fill">
      <mat-label>Add Ingredient</mat-label>
      <input
        matInput
        [(ngModel)]="newIngredient"
        (keydown.enter)="addIngredient()"
        placeholder="Type and press enter"
        name="Ingredients"
      />
    </mat-form-field>

    <!-- Ingredients Chip List -->
    <mat-chip-listbox>
      <mat-chip
        *ngFor="let ingredient of data.meal.ingredients; let i = index"
        (click)="removeIngredient(i)"
        (removed)="removeIngredient(i)"
      >
        {{ ingredient }}
      </mat-chip>
    </mat-chip-listbox>
  </form>
</div>

<!-- Dialog Actions -->
<div mat-dialog-actions class="dialog-actions">
  <button
    mat-button
    class="delete"
    *ngIf="data.meal.title"
    (click)="onDelete()"
    style="margin-right: auto"
  >
    Delete
  </button>
  <button mat-button class="save" color="primary" (click)="onSave()">
    Save
  </button>
</div>
