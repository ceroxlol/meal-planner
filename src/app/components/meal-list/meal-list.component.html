<div class="meal-list">
  <mat-card
    *ngFor="let meal of filteredMeals"
    (click)="selectMeal(meal)"
    class="meal-card"
  >
    <img [src]="meal.imageUrl" alt="No image" class="meal-image" />
    <mat-card-content>
      <h3>{{ meal.title }}</h3>
      <div class="meal-details">
        <span class="detail-label">Cooking Time:</span>
        {{ meal.cookingTime }} minutes
      </div>
      <div class="meal-details">
        <span class="detail-label">Effort Level:</span> {{ meal.effortLevel }}/5
      </div>
      <div class="ingredients">
        <h4>Ingredients:</h4>
        <ul>
          <li *ngFor="let ingredient of meal.ingredients">{{ ingredient }}</li>
        </ul>
      </div>
    </mat-card-content>
  </mat-card>
</div>
